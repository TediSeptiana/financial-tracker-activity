<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#4F46E5">
    <title>PWA Tracker Keuangan & Kegiatan</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header class="app-header">
        <h1>📊 PWA Tracker</h1>
        <nav class="tab-nav">
            <button id="tab-finance" class="tab-btn active" data-tab="finance">💰 Keuangan</button>
            <button id="tab-activity" class="tab-btn" data-tab="activity">📋 Kegiatan</button>
        </nav>
    </header>

    <main class="app-content">
        <!-- Finance Section -->
        <section id="finance-section" class="section active">
            <div class="filter-bar">
                <label for="month-filter">Bulan:</label>
                <select id="month-filter">
                    <option value="ALL">Semua</option>
                </select>
            </div>

            <div class="summary-cards">
                <div class="card income-card animate-slide-in">
                    <div class="card-icon">💵</div>
                    <h3>Pemasukan</h3>
                    <p id="total-income">Rp 0</p>
                </div>
                <div class="card expense-card animate-slide-in">
                    <div class="card-icon">💸</div>
                    <h3>Pengeluaran</h3>
                    <p id="total-expense">Rp 0</p>
                </div>
                <div class="card balance-card animate-slide-in">
                    <div class="card-icon">💎</div>
                    <h3>Saldo</h3>
                    <p id="balance">Rp 0</p>
                </div>
            </div>

            <div class="chart-container animate-fade-in">
                <canvas id="finance-chart"></canvas>
            </div>

            <!-- Transaction Type Switcher -->
            <div class="transaction-type-switcher">
                <button id="switch-income" class="switch-btn active" data-type="income">
                    <span class="switch-icon">⬆️</span>
                    <span>Pemasukan</span>
                </button>
                <button id="switch-expense" class="switch-btn" data-type="expense">
                    <span class="switch-icon">⬇️</span>
                    <span>Pengeluaran</span>
                </button>
            </div>

            <!-- Income Form Card -->
            <div id="income-form-card" class="form-card income-form-card animate-bounce-in">
                <div class="form-card-header">
                    <span class="form-card-icon">💵</span>
                    <h2>Tambah Pemasukan</h2>
                </div>
                <form id="income-form" class="transaction-form">
                    <div class="form-group">
                        <label for="income-category">Kategori:</label>
                        <select id="income-category" required>
                            <option value="">Pilih Kategori</option>
                            <option value="Gaji">💼 Gaji</option>
                            <option value="Bonus">🎁 Bonus</option>
                            <option value="Investasi">📈 Investasi</option>
                            <option value="Freelance">💻 Freelance</option>
                            <option value="Hadiah">🎉 Hadiah</option>
                            <option value="Lainnya">✨ Lainnya</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="income-amount">Jumlah:</label>
                        <input type="number" id="income-amount" min="1" step="0.01" placeholder="Masukkan jumlah" required>
                    </div>
                    <div class="form-group">
                        <label for="income-date">Tanggal:</label>
                        <input type="date" id="income-date" required>
                    </div>
                    <div class="form-group">
                        <label for="income-note">Catatan:</label>
                        <input type="text" id="income-note" placeholder="Opsional">
                    </div>
                    <button type="submit" class="btn-primary btn-income">💵 Tambah Pemasukan</button>
                </form>
            </div>

            <!-- Expense Form Card -->
            <div id="expense-form-card" class="form-card expense-form-card" style="display: none;">
                <div class="form-card-header">
                    <span class="form-card-icon">💸</span>
                    <h2>Tambah Pengeluaran</h2>
                </div>
                <form id="expense-form" class="transaction-form">
                    <div class="form-group">
                        <label for="expense-category">Kategori:</label>
                        <select id="expense-category" required>
                            <option value="">Pilih Kategori</option>
                            <option value="Makanan">🍔 Makanan</option>
                            <option value="Transportasi">🚗 Transportasi</option>
                            <option value="Belanja">🛍️ Belanja</option>
                            <option value="Hiburan">🎬 Hiburan</option>
                            <option value="Tagihan">📱 Tagihan</option>
                            <option value="Kesehatan">🏥 Kesehatan</option>
                            <option value="Pendidikan">📚 Pendidikan</option>
                            <option value="Lainnya">✨ Lainnya</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="expense-amount">Jumlah:</label>
                        <input type="number" id="expense-amount" min="1" step="0.01" placeholder="Masukkan jumlah" required>
                    </div>
                    <div class="form-group">
                        <label for="expense-date">Tanggal:</label>
                        <input type="date" id="expense-date" required>
                    </div>
                    <div class="form-group">
                        <label for="expense-note">Catatan:</label>
                        <input type="text" id="expense-note" placeholder="Opsional">
                    </div>
                    <button type="submit" class="btn-primary btn-expense">💸 Tambah Pengeluaran</button>
                </form>
            </div>

            <div class="list-section animate-fade-in">
                <h2>📝 Daftar Transaksi</h2>
                <div id="transaction-list" class="item-list"></div>
            </div>

            <div class="export-section">
                <button id="export-transactions" class="btn-secondary">📥 Ekspor CSV</button>
            </div>
        </section>

        <!-- Activity Section -->
        <section id="activity-section" class="section">
            <div class="filter-bar">
                <label for="status-filter">Status:</label>
                <select id="status-filter">
                    <option value="ALL">Semua</option>
                    <option value="OPEN">Belum Selesai</option>
                    <option value="DONE">Selesai</option>
                </select>
            </div>

            <div class="form-card activity-form-card animate-bounce-in">
                <div class="form-card-header">
                    <span class="form-card-icon">📋</span>
                    <h2>Tambah Kegiatan</h2>
                </div>
                <form id="activity-form">
                    <div class="form-group">
                        <label for="act-title">Judul:</label>
                        <input type="text" id="act-title" placeholder="Contoh: Meeting dengan klien" required>
                    </div>
                    <div class="form-group">
                        <label for="act-category">Kategori:</label>
                        <select id="act-category">
                            <option value="">Pilih Kategori</option>
                            <option value="Kerja">💼 Kerja</option>
                            <option value="Personal">👤 Personal</option>
                            <option value="Olahraga">🏃 Olahraga</option>
                            <option value="Belajar">📚 Belajar</option>
                            <option value="Sosial">👥 Sosial</option>
                            <option value="Lainnya">✨ Lainnya</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="act-date">Tanggal Jadwal:</label>
                        <input type="date" id="act-date" required>
                    </div>
                    <div class="form-group">
                        <label for="act-note">Catatan:</label>
                        <input type="text" id="act-note" placeholder="Opsional">
                    </div>
                    <button type="submit" class="btn-primary btn-activity">📋 Tambah Kegiatan</button>
                </form>
            </div>

            <div class="list-section animate-fade-in">
                <h2>📝 Daftar Kegiatan</h2>
                <div id="activity-list" class="item-list"></div>
            </div>

            <div class="export-section">
                <button id="export-activities" class="btn-secondary">📥 Ekspor CSV</button>
            </div>
        </section>
    </main>

    <!-- CDN Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
    <script src="/app.js"></script>
</body>
</html>
